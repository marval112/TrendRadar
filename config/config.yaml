app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true # Controla la visualización de actualizaciones de versión. Si es false, no mostrará avisos de nueva versión

crawler:
  request_interval: 1000 # Intervalo de solicitud (milisegundos)
  enable_crawler: true # Si habilitar rastreo de noticias. Si es false, detiene el programa directamente
  use_proxy: false # Si habilitar proxy, false para desactivar
  default_proxy: "http://127.0.0.1:10086"

# 🔸 daily (modo resumen diario)
# • Momento de envío: Envío programado (predeterminado cada hora)
# • Contenido mostrado: Todas las noticias coincidentes del día + área de nuevas noticias
# • Escenario de uso: Resumen diario, comprensión completa de tendencias del día
#
# 🔸 current (modo ranking actual)
# • Momento de envío: Envío programado (predeterminado cada hora)
# • Contenido mostrado: Noticias coincidentes del ranking actual + área de nuevas noticias
# • Escenario de uso: Seguimiento de tendencias en tiempo real, conocer contenido más popular
#
# 🔸 incremental (modo monitoreo incremental)
# • Momento de envío: Solo envía cuando hay nuevos elementos
# • Contenido mostrado: Nuevas noticias con palabras clave de frecuencia coincidentes
# • Escenario de uso: Evitar interferencia de información repetida

# Selección de modo de envío
report:
  mode: "daily" # Opciones: "daily"|"incremental"|"current"
  rank_threshold: 5 # Umbral de resaltado de clasificación

notification:
  enable_notification: true # Si habilitar notificaciones. Si es false, no envía notificaciones al móvil
  message_batch_size: 4000 # Tamaño de lote de mensajes (bytes) (no modificar esta configuración)
  dingtalk_batch_size: 20000 # Tamaño de lote de mensajes DingTalk (bytes) (tampoco modificar esto)
  feishu_batch_size: 29000 # Tamaño de lote de mensajes Feishu (bytes)
  batch_send_interval: 3 # Intervalo de envío por lotes (segundos)
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━" # Línea separadora de mensajes feishu

  # 🕐 Control de ventana de tiempo de envío (función opcional)
  # Propósito: Limitar el rango de tiempo de envío, evitar molestias fuera del horario laboral
  # Escenarios de uso:
  # - Solo recibir notificaciones durante días laborables de día (ej: 09:00-18:00)
  # - Recibir resúmenes a hora fija por la noche (ej: 20:00-22:00)
  push_window:
    enabled: false # Si habilitar control de ventana de tiempo de envío, desactivado por defecto
    # Nota: El tiempo de ejecución de GitHub Actions es inestable, se recomienda dejar al menos 2 horas de rango
    # Para envíos programados precisos, se recomienda usar despliegue Docker en servidor personal
    time_range:
      start: "20:00" # Inicio de ventana de envío (hora de Beijing)
      end: "22:00" # Fin de ventana de envío (hora de Beijing)
    once_per_day: true # Enviar solo una vez al día dentro de la ventana. Si es false, envía en cada ejecución dentro de la ventana
    push_record_retention_days: 7 # Días de retención de registros de envío

  # Por favor, guarde bien los webhooks, no los haga públicos
  # Si despliega este proyecto en GitHub mediante fork, NO llene ningún webhook aquí, póngalos en GitHub Secrets
  # De lo contrario, recibirá notificaciones extrañas de publicidad, o problemas de seguridad más graves
  webhooks:
    feishu_url: "" # webhook URL del robot Feishu
    dingtalk_url: "" # webhook URL del robot DingTalk
    wework_url: "" # webhook URL del robot WeChat Enterprise
    telegram_bot_token: "" # Token del Bot de Telegram
    telegram_chat_id: "" # ID de Chat de Telegram
    email_from: "" # Dirección de correo del remitente
    email_password: "" # Contraseña o código de autorización del correo
    email_to: "" # Dirección de correo del destinatario, múltiples separados por comas
    email_smtp_server: "" # Dirección del servidor SMTP (opcional, deja vacío para detección automática)
    email_smtp_port: "" # Puerto SMTP (opcional, deja vacío para detección automática)
    ntfy_server_url: "https://ntfy.sh" # Dirección del servidor ntfy, usa servicio público por defecto, puede cambiar a dirección auto-hospedada
    ntfy_topic: "" # Nombre del tema ntfy
    ntfy_token: "" # Token de acceso ntfy (opcional, para temas privados)

# Usado para que las noticias con mayor atención aparezcan más adelante, es decir, usa algoritmo para recombinar rankings de diferentes plataformas formando tu ranking enfocado, la suma debe ser 1
weight:
  rank_weight: 0.6 # Peso de clasificación
  frequency_weight: 0.3 # Peso de frecuencia
  hotness_weight: 0.1 # Peso de popularidad

# name puede definir cualquier nombre, solo tiene función de visualización, incluso si cambias name después de ejecutar varios días, no afectará el funcionamiento normal del código
platforms:
  - id: "toutiao"
    name: "Toutiao"
  - id: "baidu"
    name: "Baidu Tendencias"
  - id: "wallstreetcn-hot"
    name: "Wall Street News"
  - id: "thepaper"
    name: "The Paper"
  - id: "bilibili-hot-search"
    name: "Bilibili Búsqueda Tendencias"
  - id: "cls-hot"
    name: "Cailian Press Popular"
  - id: "ifeng"
    name: "Ifeng News"
  - id: "tieba"
    name: "Tieba"
  - id: "weibo"
    name: "Weibo"
  - id: "douyin"
    name: "Douyin"
  - id: "zhihu"
    name: "Zhihu"
